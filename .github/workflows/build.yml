name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ClashSpeedTest.csproj

      - name: Build
        run: dotnet build ClashSpeedTest.csproj -c Release --no-restore

      - name: Publish (self-contained single file)
        run: dotnet publish ClashSpeedTest.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashSpeedTest
          path: dist/

      # 以下两步仅在推送 v* tag（如 v1.1.0）时执行：打包并发布到 Releases
      - name: Zip release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist\* -DestinationPath "ClashSpeedTest-${{ github.ref_name }}-win-x64.zip"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "ClashSpeedTest-${{ github.ref_name }}-win-x64.zip" --generate-notes
