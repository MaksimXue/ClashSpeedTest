name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ClashSpeedTest.csproj

      - name: Build
        run: dotnet build ClashSpeedTest.csproj -c Release --no-restore

      - name: Publish (self-contained single file)
        run: dotnet publish ClashSpeedTest.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashSpeedTest
          path: dist/
